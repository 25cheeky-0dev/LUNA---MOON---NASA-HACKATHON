name: Celestial Engine
on:
  pull_request:
    paths: ['backend/**', '.gitattributes', '.github/workflows/celestial-engine.yml']
  push:
    branches: ['feature/celestial-engine']
    paths: ['backend/**', '.gitattributes', '.github/workflows/celestial-engine.yml']
jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m pip install uv
      - run: uv sync --project backend --locked --extra celestial --extra test --extra lint
      - run: uv run --project backend --no-sync ruff check backend/celestial_engine
      - run: uv run --project backend --no-sync ruff format --check backend/celestial_engine
      - run: uv run --no-sync python -m pytest -q -m 'not live'
        working-directory: backend
